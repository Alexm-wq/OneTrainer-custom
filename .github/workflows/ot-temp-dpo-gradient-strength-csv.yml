name: Apply DPO gradient strength CSV

on:
  push:
    branches: [mage-flow-full]
    paths:
      - '.github/workflows/ot-temp-dpo-gradient-strength-csv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mage-flow-full
          fetch-depth: 0

      - name: Patch gradient strength CSV diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # GenericTrainer: exact normal-vs-DPO gradient diagnostics when
          # No-Momentum DPO keeps the two accumulated gradient buffers separate.
          replace_once(
              'modules/trainer/GenericTrainer.py',
              'import contextlib\nimport copy\nimport json\n',
              'import contextlib\nimport copy\nimport csv\nimport json\n',
          )

          replace_once(
              'modules/trainer/GenericTrainer.py',
              '''        self._dpo_bypass_cpu_grads: dict[Parameter, Tensor] = {}\n        self._dpo_bypass_update_weight = 0.0\n        self._adaptive_dpo_dataset_module: AdaptiveDPODataset | None = None\n''',
              '''        self._dpo_bypass_cpu_grads: dict[Parameter, Tensor] = {}\n        self._dpo_bypass_update_weight = 0.0\n        self._dpo_gradient_csv_warned = False\n        self._adaptive_dpo_dataset_module: AdaptiveDPODataset | None = None\n''',
          )

          marker = '''    def __dpo_momentum_bypass_enabled(self) -> bool:\n'''
          methods = r'''    @staticmethod
    def __gradient_l2_stats(
            gradients,
            *,
            scale: float = 1.0,
    ) -> tuple[float, int, int]:
        """Return global L2 norm, element count, and active tensor count.

        The reductions stay on each gradient's native device and synchronize
        only once per device, so diagnostic logging does not copy normal model
        gradients to CPU. ``scale`` is used to undo GradScaler scaling without
        mutating the live optimizer gradients.
        """
        device_sums: dict[torch.device, Tensor] = {}
        element_count = 0
        tensor_count = 0

        for gradient in gradients:
            if gradient is None:
                continue
            value = gradient.detach()
            if value.is_sparse:
                value = value.coalesce().values()
            squared = value.float().square().sum(dtype=torch.float64)
            existing = device_sums.get(value.device)
            device_sums[value.device] = (
                squared if existing is None else existing + squared
            )
            element_count += int(value.numel())
            tensor_count += 1

        total_squared = sum(
            float(device_sum.item())
            for device_sum in device_sums.values()
        )
        norm = math.sqrt(max(total_squared, 0.0)) * abs(float(scale))
        return norm, element_count, tensor_count

    @staticmethod
    def __virtual_clip_scale(norm: float, max_norm: float | None) -> float:
        if max_norm is None or norm <= 0.0 or not math.isfinite(norm):
            return 1.0
        return min(1.0, float(max_norm) / (float(norm) + 1e-6))

    @staticmethod
    def __gradient_ratio(numerator: float, denominator: float) -> float:
        if denominator > 0.0:
            return float(numerator) / float(denominator)
        return math.inf if numerator > 0.0 else 0.0

    def __write_dpo_gradient_strength_csv(
            self,
            train_progress: TrainProgress,
            scaler,
            dpo_momentum_bypass: bool,
    ):
        """Log optimizer-window normal/Self-Flow and DPO gradient strength.

        Exact separation is available when No-Momentum DPO is active: normal
        gradients live in ``parameter.grad`` while DPO gradients live in the
        existing CPU bypass buffer. The reported effective DPO norm additionally
        includes the same clipping and ``update_scale`` used by the bypass step.
        """
        if not bool(getattr(
                self.config,
                "rlhf_dpo_gradient_csv_logging",
                True,
        )):
            return
        if not self.config.rlhf_enabled or not multi.is_master():
            return
        if not dpo_momentum_bypass:
            if not self._dpo_gradient_csv_warned:
                print(
                    "[OT-DPO-GRAD-CSV] Exact normal-vs-DPO gradient logging "
                    "requires 'No Momentum DPO'. No rows will be written while "
                    "that path is disabled or unsupported by the optimizer."
                )
                self._dpo_gradient_csv_warned = True
            return
        if multi.is_enabled():
            if not self._dpo_gradient_csv_warned:
                print(
                    "[OT-DPO-GRAD-CSV] Multi-GPU exact split logging is "
                    "currently disabled because the CPU DPO buffer is reduced "
                    "later in the bypass step."
                )
                self._dpo_gradient_csv_warned = True
            return
        if not self._dpo_bypass_cpu_grads:
            return

        normal_unscale = 1.0
        if scaler is not None:
            scaler_value = float(scaler.get_scale())
            if math.isfinite(scaler_value) and scaler_value > 0.0:
                normal_unscale = 1.0 / scaler_value

        normal_norm, normal_elements, normal_tensors = self.__gradient_l2_stats(
            (
                parameter.grad
                for parameter in self.parameters
                if parameter.requires_grad and parameter.grad is not None
            ),
            scale=normal_unscale,
        )
        dpo_norm, dpo_elements, dpo_tensors = self.__gradient_l2_stats(
            self._dpo_bypass_cpu_grads.values(),
        )

        max_norm = self.config.clip_grad_norm
        normal_clip_scale = self.__virtual_clip_scale(normal_norm, max_norm)
        dpo_clip_scale = self.__virtual_clip_scale(dpo_norm, max_norm)
        normal_postclip = normal_norm * normal_clip_scale
        dpo_postclip = dpo_norm * dpo_clip_scale

        dpo_update_weight = float(self._dpo_bypass_update_weight)
        dpo_effective = dpo_postclip * dpo_update_weight

        normal_rms = (
            normal_norm / math.sqrt(normal_elements)
            if normal_elements > 0
            else 0.0
        )
        dpo_rms = (
            dpo_norm / math.sqrt(dpo_elements)
            if dpo_elements > 0
            else 0.0
        )

        row = {
            "global_step": int(train_progress.global_step),
            "epoch": int(getattr(train_progress, "epoch", 0)),
            "epoch_step": int(getattr(train_progress, "epoch_step", 0)),
            "gradient_accumulation_steps": int(self.config.gradient_accumulation_steps),
            "self_flow_enabled": int(bool(getattr(self.config, "self_flow_enabled", False))),
            "dpo_gradient_scale": float(getattr(self.config, "rlhf_dpo_gradient_scale", 1.0)),
            "dpo_update_weight": dpo_update_weight,
            "clip_grad_norm": "" if max_norm is None else float(max_norm),
            "normal_grad_l2_preclip": normal_norm,
            "dpo_grad_l2_preclip": dpo_norm,
            "normal_clip_scale": normal_clip_scale,
            "dpo_clip_scale": dpo_clip_scale,
            "normal_grad_l2_postclip": normal_postclip,
            "dpo_grad_l2_postclip": dpo_postclip,
            "dpo_grad_l2_effective": dpo_effective,
            "dpo_to_normal_ratio_preclip": self.__gradient_ratio(dpo_norm, normal_norm),
            "dpo_to_normal_ratio_effective": self.__gradient_ratio(dpo_effective, normal_postclip),
            "normal_grad_rms_preclip": normal_rms,
            "dpo_grad_rms_preclip": dpo_rms,
            "normal_active_elements": normal_elements,
            "dpo_active_elements": dpo_elements,
            "normal_active_tensors": normal_tensors,
            "dpo_active_tensors": dpo_tensors,
        }

        output_path = os.path.join(
            self.config.workspace_dir,
            "dpo_gradient_strength.csv",
        )
        os.makedirs(os.path.dirname(os.path.abspath(output_path)), exist_ok=True)
        write_header = (
            not os.path.isfile(output_path)
            or os.path.getsize(output_path) == 0
        )
        with open(output_path, "a", newline="", encoding="utf-8") as handle:
            writer = csv.DictWriter(handle, fieldnames=list(row.keys()))
            if write_header:
                writer.writeheader()
            writer.writerow(row)

''' + marker

          p = Path('modules/trainer/GenericTrainer.py')
          s = p.read_text(encoding='utf-8')
          if s.count(marker) != 1:
              raise SystemExit('GenericTrainer: DPO bypass method marker mismatch')
          p.write_text(s.replace(marker, methods, 1), encoding='utf-8')

          replace_once(
              'modules/trainer/GenericTrainer.py',
              '''                        normal_grad_parameters = {\n                            parameter\n                            for parameter in self.parameters\n                            if parameter.grad is not None\n                        }\n\n                        optimizer_step_succeeded = True\n''',
              '''                        normal_grad_parameters = {\n                            parameter\n                            for parameter in self.parameters\n                            if parameter.grad is not None\n                        }\n\n                        # At this point the complete accumulation window is\n                        # present: normal/Self-Flow gradients remain in .grad,\n                        # while No-Momentum DPO gradients remain in the separate\n                        # CPU buffer. Measure before either optimizer path mutates\n                        # or clears them.\n                        self.__write_dpo_gradient_strength_csv(\n                            train_progress,\n                            scaler,\n                            dpo_momentum_bypass,\n                        )\n\n                        optimizer_step_succeeded = True\n''',
          )

          # TrainConfig: opt-in/out control. Default on for this diagnostic build
          # so existing configs immediately produce the requested CSV.
          replace_once(
              'modules/util/config/TrainConfig.py',
              '''    rlhf_dpo_beta_gradient_reference: float\n    rlhf_dpo_gradient_scale: float\n    rlhf_dpo_chosen_reward_anchor: bool\n''',
              '''    rlhf_dpo_beta_gradient_reference: float\n    rlhf_dpo_gradient_scale: float\n    rlhf_dpo_gradient_csv_logging: bool\n    rlhf_dpo_chosen_reward_anchor: bool\n''',
          )
          replace_once(
              'modules/util/config/TrainConfig.py',
              '''        data.append(("rlhf_dpo_gradient_scale", 0.25, float, False))\n        data.append(("rlhf_dpo_chosen_reward_anchor", False, bool, False))\n''',
              '''        data.append(("rlhf_dpo_gradient_scale", 0.25, float, False))\n        data.append(("rlhf_dpo_gradient_csv_logging", True, bool, False))\n        data.append(("rlhf_dpo_chosen_reward_anchor", False, bool, False))\n''',
          )

          # RLHF UI toggle directly below the gradient scale.
          replace_once(
              'modules/ui/BaseRLHFTabView.py',
              '''        self.components.entry(\n            core,\n            15,\n            1,\n            ui_state,\n            "rlhf_dpo_gradient_scale",\n        )\n\n        anchored_reject = self.components.section_frame(frame, 1)\n''',
              '''        self.components.entry(\n            core,\n            15,\n            1,\n            ui_state,\n            "rlhf_dpo_gradient_scale",\n        )\n\n        self.components.label(\n            core,\n            16,\n            0,\n            "Gradient Strength CSV",\n            tooltip=(\n                "Write dpo_gradient_strength.csv in the workspace once per "\n                "optimizer update. With No Momentum DPO active it compares the "\n                "exact accumulated normal/Self-Flow and DPO gradient L2/RMS "\n                "norms, clipping, and the effective DPO-to-normal ratio."\n            ),\n            wide_tooltip=True,\n        )\n        self.components.switch(\n            core,\n            16,\n            1,\n            ui_state,\n            "rlhf_dpo_gradient_csv_logging",\n        )\n\n        anchored_reject = self.components.section_frame(frame, 1)\n''',
          )
          PY

          python -m py_compile \
            modules/trainer/GenericTrainer.py \
            modules/util/config/TrainConfig.py \
            modules/ui/BaseRLHFTabView.py

          git diff --check
          git status --short

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git add modules/trainer/GenericTrainer.py modules/util/config/TrainConfig.py modules/ui/BaseRLHFTabView.py
          git commit -m 'Log normal and DPO gradient strength to CSV'
          git push origin HEAD:mage-flow-full
