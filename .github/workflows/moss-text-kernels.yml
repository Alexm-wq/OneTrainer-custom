name: MOSS text encoder kernels

on:
  workflow_dispatch:
  push:
    branches: [main, codex/moss-image-base]
    paths:
      - "modules/module/moss/text_encoder_kernels.py"
      - "tests/test_moss_text_kernels.py"
      - ".github/workflows/moss-text-kernels.yml"

permissions:
  contents: write

jobs:
  focused-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          run-install: false
          cache: false
      - name: Resolve the CUDA kernel dependency in the lock file
        run: |
          pixi lock
          pixi lock --check
      - name: Install only the kernel test dependencies
        run: |
          python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.5.4 fla-core==0.5.2 triton==3.7.0 ruff==0.15.20
      - name: Lint changed Python files
        run: |
          ruff check --fix modules/module/moss/text_encoder_kernels.py modules/modelLoader/MOSSImageModelLoader.py tests/test_moss_text_kernels.py
      - name: Test only the new text kernel functionality
        run: python -m unittest discover -s tests -p test_moss_text_kernels.py -v
      - name: Save generated lock and formatting on the work branch
        run: |
          if ! git diff --quiet; then
            if [ "$GITHUB_REF" != "refs/heads/codex/moss-image-base" ]; then
              git diff --exit-code
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pixi.lock modules/module/moss/text_encoder_kernels.py modules/modelLoader/MOSSImageModelLoader.py tests/test_moss_text_kernels.py
            git commit -m "Lock MOSS text kernels and normalize imports [skip ci]"
            git push origin HEAD:codex/moss-image-base
          fi
          git rev-parse HEAD
