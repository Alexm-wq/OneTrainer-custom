name: Apply DPO gradient scale

on:
  push:
    branches: [mage-flow-full]
    paths:
      - '.github/workflows/ot-temp-dpo-gradient-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mage-flow-full
          fetch-depth: 0

      - name: Add value-preserving DPO gradient scale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Persistent TrainConfig setting. Default to 0.25 so preference
          # gradients steer rather than dominate the normal chosen objective.
          replace_once(
              'modules/util/config/TrainConfig.py',
              '''    rlhf_dpo_beta_gradient_decouple: bool\n    rlhf_dpo_beta_gradient_reference: float\n    rlhf_dpo_chosen_reward_anchor: bool\n''',
              '''    rlhf_dpo_beta_gradient_decouple: bool\n    rlhf_dpo_beta_gradient_reference: float\n    rlhf_dpo_gradient_scale: float\n    rlhf_dpo_chosen_reward_anchor: bool\n''',
          )
          replace_once(
              'modules/util/config/TrainConfig.py',
              '''        data.append(("rlhf_dpo_beta_gradient_decouple", False, bool, False))\n        data.append(("rlhf_dpo_beta_gradient_reference", None, float, True))\n        data.append(("rlhf_dpo_chosen_reward_anchor", False, bool, False))\n''',
              '''        data.append(("rlhf_dpo_beta_gradient_decouple", False, bool, False))\n        data.append(("rlhf_dpo_beta_gradient_reference", None, float, True))\n        # Value-preserving global DPO backward multiplier. Rewards, margins,\n        # curriculum signals and logged losses stay in their native units.\n        data.append(("rlhf_dpo_gradient_scale", 0.25, float, False))\n        data.append(("rlhf_dpo_chosen_reward_anchor", False, bool, False))\n''',
          )
          replace_once(
              'modules/util/config/TrainConfig.py',
              '''        objective = DPOObjective(self.rlhf_dpo_objective)\n        if objective != DPOObjective.LINEAR:\n''',
              '''        objective = DPOObjective(self.rlhf_dpo_objective)\n        dpo_gradient_scale = float(getattr(self, "rlhf_dpo_gradient_scale", 0.25))\n        if not math.isfinite(dpo_gradient_scale) or dpo_gradient_scale <= 0.0:\n            raise ValueError(\n                "DPO Gradient Scale must be finite and greater than zero."\n            )\n        if objective != DPOObjective.LINEAR:\n''',
          )

          # 2) RLHF UI knob. This controls only backward magnitude, not the
          # objective's forward reward geometry.
          replace_once(
              'modules/ui/BaseRLHFTabView.py',
              '''        self.components.switch(\n            core,\n            14,\n            1,\n            ui_state,\n            "rlhf_dpo_momentum_bypass",\n        )\n\n        anchored_reject = self.components.section_frame(frame, 1)\n''',
              '''        self.components.switch(\n            core,\n            14,\n            1,\n            ui_state,\n            "rlhf_dpo_momentum_bypass",\n        )\n\n        self.components.label(\n            core,\n            15,\n            0,\n            "DPO Gradient Scale",\n            tooltip=(\n                "Multiplies only the DPO-side backward gradient while preserving "\n                "the exact forward rewards, margins, losses, curriculum values, "\n                "and normal chosen/Self-Flow supervision. 1.0 is the previous "\n                "strength; 0.25 gives quarter-strength preference gradients."\n            ),\n            wide_tooltip=True,\n        )\n        self.components.entry(\n            core,\n            15,\n            1,\n            ui_state,\n            "rlhf_dpo_gradient_scale",\n        )\n\n        anchored_reject = self.components.section_frame(frame, 1)\n''',
          )

          # 3) Scale policy-score gradients without changing their forward value.
          # Chosen supervised/Self-Flow losses do not pass through this score and
          # therefore remain full-strength. Anchored chosen-floor does use this
          # score, so it is scaled consistently with the preference objective.
          replace_once(
              'modules/modelSetup/mixin/AnchoredRejectChosenFloorMixin.py',
              '''        score = super()._dpo_score_per_sample(\n            model,\n            batch,\n            data,\n            config,\n            objective,\n        )\n        if DPOObjective(objective) != DPOObjective.ANCHORED_REJECT:\n            return score\n''',
              '''        score = super()._dpo_score_per_sample(\n            model,\n            batch,\n            data,\n            config,\n            objective,\n        )\n\n        # Value-preserving DPO gradient scaling. The reference pass is already\n        # no-grad; only policy scores need this autograd identity. Forward values\n        # remain bit-for-bit equal to the raw score, while d(score)/d(theta) is\n        # multiplied by the configured global DPO strength.\n        if not self._dpo_reference_prediction():\n            gradient_scale = float(getattr(config, "rlhf_dpo_gradient_scale", 0.25))\n            if gradient_scale != 1.0:\n                detached_score = score.detach()\n                score = detached_score + gradient_scale * (score - detached_score)\n\n        if DPOObjective(objective) != DPOObjective.ANCHORED_REJECT:\n            return score\n''',
          )
          replace_once(
              'modules/modelSetup/mixin/AnchoredRejectChosenFloorMixin.py',
              '''        if self._anchored_floor_active:\n            metrics = getattr(self, "_last_dpo_metrics", None)\n            if isinstance(metrics, dict):\n                metrics["anchored_chosen_floor_loss"] = float(\n                    self._anchored_floor_last_value\n                )\n''',
              '''        metrics = getattr(self, "_last_dpo_metrics", None)\n        if isinstance(metrics, dict):\n            metrics["dpo_gradient_scale"] = float(\n                getattr(config, "rlhf_dpo_gradient_scale", 0.25)\n            )\n            if self._anchored_floor_active:\n                metrics["anchored_chosen_floor_loss"] = float(\n                    self._anchored_floor_last_value\n                )\n''',
          )
          PY

          python -m py_compile \
            modules/util/config/TrainConfig.py \
            modules/ui/BaseRLHFTabView.py \
            modules/modelSetup/mixin/AnchoredRejectChosenFloorMixin.py

          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git add \
            modules/util/config/TrainConfig.py \
            modules/ui/BaseRLHFTabView.py \
            modules/modelSetup/mixin/AnchoredRejectChosenFloorMixin.py
          git commit -m 'Add configurable DPO gradient scale'
          git push origin HEAD:mage-flow-full
