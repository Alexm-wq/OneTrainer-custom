name: Temporary Mage-Flow validation

on:
  pull_request:
    branches: [main]

jobs:
  mage-flow-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mage implementation branch
        uses: actions/checkout@v4
        with:
          ref: mage-flow-full

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile all Mage integration files
        run: |
          python -m compileall -q \
            modules/model/MageFlowModel.py \
            modules/module/MageFlowSelfFlow.py \
            modules/modelLoader/mageFlow \
            modules/modelLoader/MageFlowLoRAModelLoader.py \
            modules/modelLoader/MageFlowFineTuneModelLoader.py \
            modules/modelSetup/BaseMageFlowSetup.py \
            modules/modelSetup/MageFlowLoRASetup.py \
            modules/modelSetup/MageFlowFineTuneSetup.py \
            modules/dataLoader/mage \
            modules/dataLoader/MageFlowBaseDataLoader.py \
            modules/dataLoader/dpo/EncodeDPORejectedOrDummyLatent.py \
            modules/modelSampler/MageFlowSampler.py \
            modules/modelSaver/mageFlow \
            modules/modelSaver/MageFlowLoRAModelSaver.py \
            modules/modelSaver/MageFlowFineTuneModelSaver.py \
            modules/util/enum/ModelType.py \
            tests/test_mage_flow_self_flow.py

      - name: Install CPU torch for isolated Self-Flow tests
        run: python -m pip install --quiet torch

      - name: Run Mage Self-Flow unit tests
        run: python -m unittest -v tests.test_mage_flow_self_flow

      - name: Checkout current Microsoft Mage source for API validation
        run: git clone --depth 1 https://github.com/microsoft/Mage.git /tmp/Mage

      - name: Validate Mage API assumptions statically
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('/tmp/Mage')
          pipeline = ast.parse((root/'mage_flow/pipeline.py').read_text())
          mage_model = ast.parse((root/'mage_flow/models/mage_flow.py').read_text())
          layers = ast.parse((root/'mage_flow/models/modules/mage_layers.py').read_text())

          def functions(tree):
              return {n.name: n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}

          pfunc = functions(pipeline)
          mfunc = functions(mage_model)
          lfunc = functions(layers)
          assert 'load_from_repo' in pfunc, 'Mage pipeline.load_from_repo missing'
          assert 'forward' in mfunc, 'Mage model forward missing'
          assert '_modulate' in lfunc, 'Mage block _modulate missing'

          forward_args = {a.arg for a in mfunc['forward'].args.args}
          required = {'img','txt','timesteps','img_shapes','img_cu_seqlens','txt_cu_seqlens'}
          missing = required - forward_args
          assert not missing, f'Mage forward API drift: missing {sorted(missing)}'

          mod_args = {a.arg for a in lfunc['_modulate'].args.args}
          assert {'x','mod_params','cu_lens'} <= mod_args, f'_modulate API drift: {sorted(mod_args)}'

          src = (root/'mage_flow/models/mage_flow.py').read_text()
          assert 'self.vae.encode(' in src, 'Expected direct Mage VAE encode path missing'
          print('Microsoft Mage API assumptions: PASS')
          PY
