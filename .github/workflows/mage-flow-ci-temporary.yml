name: Temporary Mage-Flow validation

on:
  pull_request:
    branches: [main]

jobs:
  mage-flow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mage-flow-full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Mage integration
        run: |
          python -m compileall -q \
            modules/model/MageFlowModel.py \
            modules/module/MageFlowSelfFlow.py \
            modules/modelLoader/mageFlow \
            modules/modelLoader/MageFlowLoRAModelLoader.py \
            modules/modelLoader/MageFlowFineTuneModelLoader.py \
            modules/modelSetup/BaseMageFlowSetup.py \
            modules/modelSetup/MageFlowLoRASetup.py \
            modules/modelSetup/MageFlowFineTuneSetup.py \
            modules/dataLoader/mage \
            modules/dataLoader/MageFlowBaseDataLoader.py \
            modules/dataLoader/dpo/EncodeDPORejectedOrDummyLatent.py \
            modules/modelSampler/MageFlowSampler.py \
            modules/modelSaver/mageFlow \
            modules/modelSaver/MageFlowLoRAModelSaver.py \
            modules/modelSaver/MageFlowFineTuneModelSaver.py \
            modules/util/enum/ModelType.py \
            tests/test_mage_flow_self_flow.py \
            tests/test_mage_flow_model_helpers.py \
            tests/test_mage_flow_official_runtime.py
      - name: Install CPU torch
        run: python -m pip install --quiet torch
      - name: Run isolated Self-Flow tests
        run: python -m unittest -v tests.test_mage_flow_self_flow
      - name: Validate current Microsoft Mage API statically
        run: |
          git clone --depth 1 https://github.com/microsoft/Mage.git /tmp/Mage
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('/tmp/Mage')
          pipeline = ast.parse((root/'mage_flow/pipeline.py').read_text())
          model = ast.parse((root/'mage_flow/models/mage_flow.py').read_text())
          layers = ast.parse((root/'mage_flow/models/modules/mage_layers.py').read_text())
          funcs = lambda tree: {n.name:n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          pf, mf, lf = funcs(pipeline), funcs(model), funcs(layers)
          assert 'load_from_repo' in pf
          required = {'img','txt','timesteps','img_shapes','img_cu_seqlens','txt_cu_seqlens'}
          assert required <= {a.arg for a in mf['forward'].args.args}
          assert {'x','mod_params','cu_lens'} <= {a.arg for a in lf['_modulate'].args.args}
          assert 'self.vae.encode(' in (root/'mage_flow/models/mage_flow.py').read_text()
          print('Current Microsoft Mage API: PASS')
          PY

  onetrainer-cpu-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mage-flow-full
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.71.2
          cache: true
          environments: cpu
      - name: Verify exact OneTrainer environment
        run: |
          pixi run -e cpu python - <<'PY'
          import sys, torch
          assert sys.version_info[:2] == (3,13), sys.version
          assert torch.__version__.startswith('2.12.0'), torch.__version__
          print('OneTrainer environment:', sys.version.split()[0], torch.__version__)
          PY
      - name: Prepare current Mage source without changing core dependencies
        run: |
          git clone --depth 1 https://github.com/microsoft/Mage.git /tmp/Mage-runtime
          pixi run -e cpu python -m ensurepip --upgrade
          pixi run -e cpu python -m pip install --no-deps 'einops>=0.8.0' 'loguru>=0.7.0'
      - name: Import current Mage on torch 2.12
        env:
          PYTHONPATH: /tmp/Mage-runtime
        run: |
          pixi run -e cpu python - <<'PY'
          import inspect, torch
          from mage_flow.pipeline import load_from_repo, generate_images
          from mage_flow.models.mage_flow import MageFlow
          required = {'img','txt','timesteps','img_shapes','img_cu_seqlens','txt_cu_seqlens'}
          assert required <= set(inspect.signature(MageFlow.forward).parameters)
          assert callable(load_from_repo) and callable(generate_images)
          print('Microsoft Mage runtime on OneTrainer torch', torch.__version__, ': PASS')
          PY
      - name: Run Mage model helper tests
        env:
          PYTHONPATH: /tmp/Mage-runtime
        run: pixi run -e cpu python -m unittest -v tests.test_mage_flow_model_helpers
      - name: Run against real tiny Microsoft Mage transformer
        env:
          PYTHONPATH: /tmp/Mage-runtime
        run: pixi run -e cpu python -m unittest -v tests.test_mage_flow_official_runtime
      - name: Verify Mage factories without importing incompatible pinned MGDS cache API
        env:
          PYTHONPATH: /tmp/Mage-runtime
        run: |
          pixi run -e cpu python - <<'PY'
          import ast
          import sys
          import types
          from pathlib import Path

          # Existing custom-branch encryption_util expects mgds.crypto, absent
          # from the repository's pinned MGDS commit. Stub only that unrelated
          # pre-existing symbol for this registration-only check.
          crypto = types.ModuleType('mgds.crypto')
          crypto.configure_encryption_key = lambda *args, **kwargs: None
          sys.modules['mgds.crypto'] = crypto

          from modules.util import factory
          original_import_dir = factory.import_dir
          factory.import_dir = lambda *args, **kwargs: None
          try:
              # Finish initializing create/optimizer_util without recursively
              # importing every model/data-loader module. This mirrors their
              # normal dependency relationship while avoiding the old MGDS
              # MultiResolutionDiskCache import unrelated to Mage.
              from modules.util import create
          finally:
              factory.import_dir = original_import_dir

          from modules.util.enum.ModelType import ModelType
          from modules.util.enum.TrainingMethod import TrainingMethod
          from modules.modelLoader.BaseModelLoader import BaseModelLoader
          from modules.modelSetup.BaseModelSetup import BaseModelSetup
          from modules.modelSampler.BaseModelSampler import BaseModelSampler
          from modules.modelSaver.BaseModelSaver import BaseModelSaver

          import modules.modelLoader.MageFlowLoRAModelLoader
          import modules.modelLoader.MageFlowFineTuneModelLoader
          import modules.modelSetup.MageFlowLoRASetup
          import modules.modelSetup.MageFlowFineTuneSetup
          import modules.modelSampler.MageFlowSampler
          import modules.modelSaver.MageFlowLoRAModelSaver
          import modules.modelSaver.MageFlowFineTuneModelSaver

          assert ModelType.MAGE_FLOW.is_mage_flow()
          assert ModelType.MAGE_FLOW.is_flow_matching()
          assert ModelType.MAGE_FLOW.model_parts() == ('transformer','text_encoder','vae')
          assert factory.get(BaseModelLoader, ModelType.MAGE_FLOW, TrainingMethod.LORA)
          assert factory.get(BaseModelLoader, ModelType.MAGE_FLOW, TrainingMethod.FINE_TUNE)
          assert factory.get(BaseModelSetup, ModelType.MAGE_FLOW, TrainingMethod.LORA)
          assert factory.get(BaseModelSetup, ModelType.MAGE_FLOW, TrainingMethod.FINE_TUNE)
          assert factory.get(BaseModelSampler, ModelType.MAGE_FLOW)
          assert factory.get(BaseModelSaver, ModelType.MAGE_FLOW, TrainingMethod.LORA)
          assert factory.get(BaseModelSaver, ModelType.MAGE_FLOW, TrainingMethod.FINE_TUNE)

          # DataLoader cannot be imported dynamically in the clean locked env
          # because the pre-existing custom branch references an MGDS cache
          # class absent from its pinned MGDS commit. Still verify our class is
          # syntactically registered for exactly MAGE_FLOW.
          source = Path('modules/dataLoader/MageFlowBaseDataLoader.py').read_text()
          tree = ast.parse(source)
          registrations = []
          for node in ast.walk(tree):
              if isinstance(node, ast.ClassDef) and node.name == 'MageFlowBaseDataLoader':
                  registrations = [ast.unparse(d) for d in node.decorator_list]
          assert any('factory.register(BaseDataLoader, ModelType.MAGE_FLOW)' in d for d in registrations), registrations
          print('Mage loader/setup/sampler/saver factories: PASS')
          print('Mage DataLoader registration (static, MGDS pin blocks runtime import): PASS')
          PY
