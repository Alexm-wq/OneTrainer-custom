name: MOSS Image integration

on:
  push:
    branches: [main, codex/moss-image-base]
    paths:
      - "modules/**"
      - "tests/test_moss_image.py"
      - "training_presets/MOSS Image/**"
      - ".github/workflows/moss-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . ruff==0.15.20
      - name: Lint integration
        run: |
          files=('modules/model/MOSSImageModel.py' 'modules/modelLoader/MOSSImageModelLoader.py' 'modules/modelSetup/BaseMOSSImageSetup.py' 'modules/modelSetup/MOSSImageLoRASetup.py' 'modules/modelSetup/MOSSImageFineTuneSetup.py' 'modules/dataLoader/moss/EncodeMOSSImageText.py' 'modules/dataLoader/moss/__init__.py' 'modules/dataLoader/MOSSImageBaseDataLoader.py' 'modules/dataLoader/mixin/DataLoaderText2ImageMixin.py' 'modules/modelSampler/MOSSImageSampler.py' 'modules/modelSaver/MOSSImageLoRAModelSaver.py' 'modules/modelSaver/moss/MOSSImageLoRASaver.py' 'modules/modelSaver/MOSSImageFineTuneModelSaver.py' 'modules/modelSaver/moss/MOSSImageModelSaver.py' 'modules/modelSaver/moss/__init__.py' 'modules/util/enum/ModelType.py' 'modules/ui/TopBarController.py' 'modules/ui/ModelTabController.py' 'modules/util/config/SampleConfig.py' 'modules/ui/BaseSampleFrameView.py' 'tests/test_moss_image.py')
          ruff check --fix "${files[@]}"
          if ! git diff --quiet; then
            if [ "$GITHUB_REF" != "refs/heads/codex/moss-image-base" ]; then
              git diff --exit-code
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Normalize MOSS integration imports and lint"
            git push origin HEAD:codex/moss-image-base
          fi
      - name: MOSS integration and existing regressions
        run: |
          python -m unittest discover -s tests -p test_moss_image.py -v
          python -m unittest discover -s tests -p test_multi_resolution_cache.py -v
          python -m unittest discover -s tests -p test_krea2_multires_integration.py -v
          python -m unittest discover -s tests -p test_krea2_checkpoint.py -v
          python -m unittest discover -s tests -p test_mixed_rlhf.py -v
      - name: Record tested commit
        run: git rev-parse HEAD
