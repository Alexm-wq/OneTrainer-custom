name: MOSS Image integration

on:
  push:
    branches: [main, codex/moss-image-base]
    paths:
      - "modules/**"
      - "tests/test_moss_image.py"
      - "tests/test_moss_features.py"
      - "tests/test_moss_offloading.py"
      - "tests/test_moss_training_ui.py"
      - "training_presets/MOSS Image/**"
      - ".github/workflows/moss-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cpu-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install headless GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 xvfb xauth
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . ruff==0.15.20 bitsandbytes==0.49.2
      - name: Lint integration
        run: |
          files=('modules/modelLoader/MOSSImageModelLoader.py' 'modules/modelSetup/BaseMOSSImageSetup.py' 'modules/util/quantization_util.py' 'modules/module/quantized/LinearInt8.py' 'modules/ui/BaseModelTabView.py' 'modules/ui/BaseTrainingTabView.py' 'modules/ui/TrainingTabController.py' 'modules/modelSaver/moss/MOSSImageModelSaver.py' 'modules/util/LayerOffloadConductor.py' 'modules/module/LoRAModule.py' 'tests/test_moss_features.py' 'tests/test_moss_offloading.py' 'tests/test_moss_training_ui.py')
          ruff check --fix "${files[@]}"
          if ! git diff --quiet; then
            if [ "$GITHUB_REF" != "refs/heads/codex/moss-image-base" ]; then
              git diff --exit-code
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Normalize MOSS integration imports and lint"
            git push origin HEAD:codex/moss-image-base
          fi
      - name: Build both training UIs and verify editable controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=tests:. xvfb-run -a python -m unittest -v \
            test_moss_training_ui.CtkTrainingUITest.test_new_moss_quantization_and_offload_controls \
            test_moss_training_ui.PySide6TrainingUITest.test_new_moss_quantization_and_offload_controls
      - name: Focused MOSS integration tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p test_moss_image.py -v
      - name: Focused MOSS feature tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p test_moss_features.py -v
      - name: Focused MOSS offloading tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p test_moss_offloading.py -v
      - name: Record tested commit
        run: git rev-parse HEAD
