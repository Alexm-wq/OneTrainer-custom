name: RLHF backup focused checks
on:
  push:
    branches: [codex/rlhf-backup-resume]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rlhf-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . ruff
      - name: Syntax and lint only changed Python files
        run: |
          files=(modules/modelSetup/BaseModelSetup.py modules/trainer/GenericTrainer.py tests/test_rlhf_backup.py)
          python -m compileall -q "${files[@]}"
          ruff check --fix --select F,I "${files[@]}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Normalize RLHF backup test imports"
            git push origin HEAD:codex/rlhf-backup-resume
          fi
      - name: Test RLHF backup and resume only
        run: |
          PYTHONPATH=.:tests python -m unittest test_rlhf_backup -v
      - name: Record tested commit
        if: always()
        run: git rev-parse HEAD
