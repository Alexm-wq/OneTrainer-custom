name: Multi-resolution cache tests

on:
  push:
    branches: [main, codex/multi-resolution-cache]
    paths:
      - "modules/dataLoader/**"
      - "tests/test_multi_resolution_cache.py"
      - "tests/test_bucket_table.py"
      - "modules/util/concept_stats.py"
      - "tests/test_krea2_multires_integration.py"
      - "tests/test_krea2_checkpoint.py"
      - ".github/workflows/multi-resolution-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pre-commit
      - name: Normalize and check ported files
        run: |
          files=(modules/dataLoader/cache/*.py modules/dataLoader/mixin/DataLoaderText2ImageMixin.py tests/test_multi_resolution_cache.py tests/test_krea2_multires_integration.py docs/MultiResolutionCaching.md .github/workflows/multi-resolution-cache.yml)
          pre-commit run --files "${files[@]}" || pre-commit run --files "${files[@]}"
          if ! git diff --quiet; then
            if [ "$GITHUB_REF" != "refs/heads/codex/multi-resolution-cache" ]; then
              git diff --exit-code
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Normalize multi-resolution cache port"
            git push origin HEAD:codex/multi-resolution-cache
          fi
      - name: Test multi-resolution cache and Krea integration
        run: |
          python -m unittest discover -s tests -p test_multi_resolution_cache.py -v
          python -m unittest discover -s tests -p test_bucket_table.py -v
          python -m unittest discover -s tests -p test_krea2_multires_integration.py -v
          python -m unittest discover -s tests -p test_krea2_checkpoint.py -v
          python -m unittest discover -s tests -p test_mixed_rlhf.py -v
      - name: Record tested commit
        run: git rev-parse HEAD
