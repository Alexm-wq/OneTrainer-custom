name: MOSS text cache progress

on:
  push:
    branches: [codex/moss-cache-progress]
    paths:
      - "modules/dataLoader/moss/MOSSConditioningCache.py"
      - "tests/test_moss_cache_progress.py"
      - ".github/workflows/moss-cache-progress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal CPU test dependencies
        run: |
          python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tqdm==4.67.1 ruff==0.15.20
          python -m pip install --no-deps "git+https://github.com/Nerogar/mgds.git@3a6994ad18a490acc4f3876658167525b7d88da7"
      - name: Lint only the changed cache and its tests
        run: ruff check modules/dataLoader/moss/MOSSConditioningCache.py tests/test_moss_cache_progress.py
      - name: Test progress display and preservation of existing cache files
        run: python -m unittest discover -s tests -p test_moss_cache_progress.py -v
