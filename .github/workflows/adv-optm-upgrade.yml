name: adv-optm upgrade
on:
  workflow_dispatch:
  push:
    branches: [codex/adv-optm-update]
    paths:
      - "tests/test_adv_optm_upgrade.py"
      - ".github/workflows/adv-optm-upgrade.yml"
      - "pyproject.toml"
permissions:
  contents: read
jobs:
  focused-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      PYTHONPATH: "."
      ADV_OPTM_LEGACY_FIXTURE: "${{ runner.temp }}/adv-optm-2512.pt"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU runtime and the fork's dependency versions
        run: |
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[cpu]'
      - name: Create checkpoints with the previous optimizer version
        run: |
          python -m pip install --no-deps adv-optm==2.5.12
          python tests/test_adv_optm_upgrade.py --write-legacy "$ADV_OPTM_LEGACY_FIXTURE"
      - name: Upgrade and test only affected optimizer behavior
        run: |
          python -m pip install --no-deps adv-optm==2.5.16
          python -m unittest discover -s tests -p test_adv_optm_upgrade.py -v
