name: MOSS layout support

on:
  push:
    branches: [codex/moss-layout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install headless GUI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 xvfb xauth
      - name: Install CPU dependencies without model weights
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . ruff==0.15.20 bitsandbytes==0.49.2
      - name: Lint changed layout files
        run: |
          files=(modules/util/moss_layout.py modules/util/moss_bucketing.py modules/dataLoader/moss/MOSSLayout.py modules/dataLoader/moss/MOSSConditioningCache.py modules/dataLoader/MOSSImageBaseDataLoader.py modules/model/MOSSImageModel.py modules/modelSampler/MOSSImageSampler.py modules/ui/MOSSLayoutEditor.py scripts/moss_layout_ui.py tests/test_moss_layout.py tests/test_moss_layout_ui.py)
          ruff check --fix "${files[@]}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Normalize MOSS layout imports [skip ci]"
            git push origin HEAD:codex/moss-layout
          fi
      - name: Test new layout data, geometry, sampling and cache functionality
        run: python -m unittest discover -s tests -p test_moss_layout.py -v
      - name: Test real Qt and CTk annotation and sampling UI
        if: ${{ !cancelled() }}
        run: xvfb-run -a python -m unittest discover -s tests -p test_moss_layout_ui.py -v
      - name: Check standalone tool entry point
        run: python scripts/moss_layout_ui.py --help
      - name: Record tested commit
        run: git rev-parse HEAD
