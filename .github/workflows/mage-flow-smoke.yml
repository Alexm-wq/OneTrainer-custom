name: Mage-Flow smoke

on:
  push:
    branches: [mage-flow-full]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Mage and adaptive DPO integration
        run: |
          python -m compileall -q \
            modules/ui/TopBarController.py \
            modules/ui/BaseTrainingTabView.py \
            modules/ui/TrainUIController.py \
            modules/model/MageFlowModel.py \
            modules/module/MageFlowAttention.py \
            modules/module/MageFlowSelfFlow.py \
            modules/modelLoader/mageFlow \
            modules/modelLoader/MageFlowLoRAModelLoader.py \
            modules/modelLoader/MageFlowFineTuneModelLoader.py \
            modules/modelSetup/BaseMageFlowSetup.py \
            modules/modelSetup/MageFlowLoRASetup.py \
            modules/modelSetup/MageFlowFineTuneSetup.py \
            modules/dataLoader/mage \
            modules/dataLoader/MageFlowBaseDataLoader.py \
            modules/dataLoader/dpo/AdaptiveDPODataset.py \
            modules/dataLoader/dpo/EncodeDPORejectedOrDummyLatent.py \
            modules/dataLoader/mixin/DataLoaderText2ImageMixin.py \
            modules/modelSampler/MageFlowSampler.py \
            modules/modelSaver/mageFlow \
            modules/modelSaver/MageFlowLoRAModelSaver.py \
            modules/modelSaver/MageFlowFineTuneModelSaver.py \
            modules/util/config/TrainConfig.py \
            modules/util/encryption_util.py \
            modules/util/enum/ModelType.py \
            tests/test_adaptive_dpo_dataset_policy.py \
            tests/test_mage_flow_self_flow.py \
            tests/test_mage_flow_presets.py
      - name: Validate Mage UI registration
        run: |
          python - <<'PY'
          from pathlib import Path
          top = Path('modules/ui/TopBarController.py').read_text(encoding='utf-8')
          train = Path('modules/ui/BaseTrainingTabView.py').read_text(encoding='utf-8')
          assert '("Mage Flow", ModelType.MAGE_FLOW)' in top
          assert 'elif model_type.is_mage_flow():' in train
          assert 'def __setup_mage_flow_ui' in train
          assert 'self.__create_self_flow_frame(column_1, 3, ui_state)' in train
          print('Mage UI registration: PASS')
          PY
      - name: Validate recoverable encryption and Mage quantization wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          encryption = Path('modules/util/encryption_util.py').read_text(encoding='utf-8')
          ui = Path('modules/ui/TrainUIController.py').read_text(encoding='utf-8')
          mage = Path('modules/modelLoader/mageFlow/MageFlowModelLoader.py').read_text(encoding='utf-8')
          mage_cache = Path('modules/dataLoader/mage/EncodeMageText.py').read_text(encoding='utf-8')
          mage_loader = Path('modules/dataLoader/MageFlowBaseDataLoader.py').read_text(encoding='utf-8')

          assert 'class MissingEncryptionKeyError(RuntimeError)' in encryption
          assert 'configure_data_encryption(self.train_config)' in ui
          assert 'except MissingEncryptionKeyError as exc:' in ui
          assert 'self.training_thread = None' in ui
          assert 'self.training_commands = None' in ui
          assert 'self.training_callbacks = None' in ui

          assert 'class MageFlowModelLoader(HFModelLoaderMixin)' in mage
          assert 'official.transformer = self._convert_diffusers_sub_module_to_dtype(' in mage
          assert 'weight_dtypes.transformer' in mage
          assert 'official.txt_enc.hf_module = self._convert_transformers_sub_module_to_dtype(' in mage
          te_conversion = mage.split(
              'official.txt_enc.hf_module = self._convert_transformers_sub_module_to_dtype(', 1
          )[1].split(')', 1)[0]
          assert 'weight_dtypes.text_encoder' in te_conversion
          assert 'None' in te_conversion
          assert 'quantization' not in te_conversion
          assert 'official.vae = self._convert_diffusers_sub_module_to_dtype(' in mage
          assert 'QuantizedLinearMixin' in mage

          assert 'OT_MAGE_ATTN_BACKEND' in mage
          assert 'OT_MAGE_QWEN_ATTN_IMPL' in mage
          assert 'qwen_impl = os.environ.get("OT_MAGE_QWEN_ATTN_IMPL", "sdpa")' in mage
          assert 'set_attn_backend("sdpa")' in mage
          assert 'backend_state["dit"]' in mage
          assert 'quantized_weight_layers=' in mage
          assert 'weight_dtypes.text_encoder.is_quantized() and te_quantized == 0' in mage
          assert 'model.mage_attention_backend = mage_attn_backend' in mage

          assert '_MAGE_TEXT_ATTENTION_LOCK = threading.Lock()' in mage_cache
          assert 'set_attn_backend("sdpa")' in mage_cache
          assert 'set_attn_backend(self.restore_attention_backend)' in mage_cache
          assert 'restore_attention_backend=getattr(' in mage_loader

          print('Encryption recovery, Mage quantization, and text-cache attention guards: PASS')
          PY
      - name: Validate Mage performance sampling and Self-Flow metrics wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          setup = Path('modules/modelSetup/BaseMageFlowSetup.py').read_text(encoding='utf-8')
          model = Path('modules/model/MageFlowModel.py').read_text(encoding='utf-8')
          attention = Path('modules/module/MageFlowAttention.py').read_text(encoding='utf-8')
          sampler = Path('modules/modelSampler/MageFlowSampler.py').read_text(encoding='utf-8')
          lora = Path('modules/modelSetup/MageFlowLoRASetup.py').read_text(encoding='utf-8')
          finetune = Path('modules/modelSetup/MageFlowFineTuneSetup.py').read_text(encoding='utf-8')

          assert 'install_optimized_mage_attention(model.transformer)' in setup
          assert 'block.compile(dynamic=True)' in setup
          assert 'torch.compile(' in setup
          assert 'ot_packed_routing' in setup
          assert 'performance/teacher_forward_ms' in setup
          assert 'performance/student_forward_backward_ms' in setup
          assert 'loss/self_flow_rep' in setup
          assert 'loss/self_flow_structural' in setup
          assert 'self_flow/cosine_similarity' in setup
          assert 'def report_to_tensorboard(' in setup

          assert 'packed = text[mask].unsqueeze(0)' in model
          assert 'self._cu_seqlens_tensor(lengths)' in model
          assert '.tolist()' not in model.split('def prepare_packed_text', 1)[1].split('def prepare_packed_images', 1)[0]
          assert '.item()' not in model.split('def prepare_packed_text', 1)[1].split('def prepare_packed_images', 1)[0]

          assert 'class OneTrainerMageDoubleStreamAttnProcessor' in attention
          assert 'shared_cache=on' in attention
          assert 'configure_mage_attention_from_config' in attention
          assert 'AttentionMechanism.FLASH' in attention
          assert 'selected = "flash4"' in attention
          assert 'max_seqlen = joint_lens.max().item()' not in attention

          assert 'configure_mage_attention_from_config(model, config)' in lora
          assert 'configure_mage_attention_from_config(model, config)' in finetune

          assert '[Mage-Flow sample] Qwen prompt screening...' in sampler
          assert 'max_new_tokens=64' in sampler
          assert 'official.txt_enc.screen_text = cached_screen_text' in sampler
          assert 'official.txt_enc.screen_text = original_screen_text' in sampler

          print('Mage performance, sampling, compile, and Self-Flow metrics wiring: PASS')
          PY
      - name: Validate adaptive DPO keep floor and warmup
        run: python -m unittest -v tests.test_adaptive_dpo_dataset_policy
      - name: Validate Mage 5090 presets
        run: python -m unittest -v tests.test_mage_flow_presets
      - name: Install CPU torch for isolated Self-Flow test
        run: python -m pip install --quiet torch
      - name: Run Mage Self-Flow unit smoke
        run: python -m unittest -v tests.test_mage_flow_self_flow
